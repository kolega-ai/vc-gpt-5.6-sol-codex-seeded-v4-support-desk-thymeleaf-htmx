server: { port: 8082 }
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supportdesk}
    username: ${DB_USER:support}
    password: ${DB_PASSWORD:local-support-password}
  jpa:
    hibernate: { ddl-auto: validate }
    properties: { hibernate.default_schema: core_mock }
  flyway: { schemas: core_mock, create-schemas: true }
app.scope-secret: ${SCOPE_SECRET:local-development-core-key-change-me-32}
