<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Tickets')}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><main class="app-main"><header th:replace="~{fragments :: topbar(${isCustomer}?'Organisation tickets':'Ticket queue',${isCustomer}?'Shared history':'TRIAGE & DELIVERY')}"></header><div class="content"><div th:replace="~{fragments :: flash}"></div>
<div class="page-actions"><p th:text="${isCustomer}?'Requests opened by colleagues in your organisation.':'Prioritised by the promises closest to expiring.'"></p><a th:if="${isCustomer}" class="btn btn-primary" href="/tickets/new">+ Open ticket</a></div>
<form th:if="${!isCustomer}" class="filter-bar" method="post" action="/tickets/handoff"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="envelope" placeholder="Legacy dispatch envelope" required><button class="btn btn-quiet">Restore queue handoff</button></form>
<form class="filter-bar" hx-get="/fragments/tickets" hx-target="#ticket-results" hx-trigger="change, keyup changed delay:350ms from:#q" hx-push-url="true"><label class="search"><span>⌕</span><input id="q" name="q" th:value="${q}" placeholder="Search ticket or subject" aria-label="Search tickets"></label><label><span>Status</span><select name="status"><option value="">All statuses</option><option th:each="s:${ {'new','open','pending_customer','pending_internal','escalated','resolved','closed'} }" th:value="${s}" th:text="${#strings.replace(s,'_',' ')}" th:selected="${status==s}"></option></select></label><label><span>Priority</span><select name="priority"><option value="">All priorities</option><option th:each="p:${ {'urgent','high','normal','low'} }" th:value="${p}" th:text="${p}" th:selected="${priority==p}"></option></select></label></form>
<section id="ticket-results" th:fragment="ticket-results" class="panel ticket-results"><form th:if="${isLead}" id="queue-action" class="queue-action" method="post" action="/tickets/queue"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="status"><option th:each="s:${ {'open','pending_internal','resolved','closed'} }" th:value="${s}" th:text="${#strings.replace(s,'_',' ')}"></option></select><button class="btn btn-quiet">Apply to selected</button></form><div class="result-count"><strong th:text="${ticketPage.totalElements}+' tickets'"></strong><span>scoped to your access</span></div><div class="table-wrap"><table><thead><tr><th th:if="${!isCustomer}"></th><th>Ticket</th><th>Customer</th><th>Team / owner</th><th>Priority</th><th>Status</th><th>Promise</th></tr></thead><tbody><tr th:each="t:${ticketPage.content}"><td th:if="${!isCustomer}"><input form="queue-action" type="checkbox" name="ids" th:value="${t.id}" aria-label="Select ticket"></td><td><a th:href="@{/tickets/{id}(id=${t.id})}"><strong th:text="${t.reference}"></strong><span th:text="${t.subject}"></span></a></td><td><strong th:text="${t.organization}"></strong><span th:text="${t.requester}"></span></td><td><strong th:text="${t.team}"></strong><span th:text="${t.assignee}"></span></td><td><span class="badge" th:classappend="${t.priority}" th:text="${t.priority}"></span></td><td><span class="badge status" th:text="${#strings.replace(t.status,'_',' ')}"></span></td><td><span th:class="${t.overdue}?'sla overdue':'sla'" th:text="${t.overdue}?'Past due':'On track'"></span></td></tr><tr th:if="${#lists.isEmpty(ticketPage.content)}"><td colspan="6" class="empty"><strong>No tickets match these filters.</strong><span>Clear one or more filters to widen the queue.</span></td></tr></tbody></table></div></section>
</div></main></body></html>
