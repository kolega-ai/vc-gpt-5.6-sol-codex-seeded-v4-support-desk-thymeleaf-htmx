<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('New article')}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><main class="app-main"><header th:replace="~{fragments :: topbar('New knowledge article','AUTHORING')}"></header><div class="content narrow"><a class="back" href="/knowledge">← Back to knowledge</a><section class="panel form-panel"><form method="post" th:action="${editing}?@{/knowledge/{id}(id=${articleId})}:@{/knowledge}" th:object="${articleForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="state" th:value="${editing}?${articleForm.status}:'draft'"><label>Title<input th:field="*{title}" maxlength="180" required></label><label>Summary<textarea th:field="*{summary}" rows="3" maxlength="400" required></textarea></label><label>Audience<select th:field="*{visibility}"><option value="PUBLIC">Customers and staff</option><option value="STAFF">Staff only</option></select></label><label>Article body<textarea th:field="*{body}" rows="16" maxlength="10000" required></textarea><small>Plain text is rendered with contextual escaping. Keep steps concise.</small></label><div class="form-actions"><a class="btn btn-quiet" href="/knowledge">Cancel</a><button class="btn btn-primary">Save draft</button></div></form><form th:if="${editing}" method="post" th:action="@{/knowledge/{id}/delete(id=${articleId})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-danger">Delete draft</button></form></section></div></main></body></html>
