<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Knowledge')}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><main class="app-main"><header th:replace="~{fragments :: topbar('Knowledge library',${isCustomer}?'SELF-SERVICE':'AUTHORING WORKSPACE')}"></header><div class="content"><div class="page-actions"><p th:text="${isCustomer}?'Verified answers from the support team.':'Draft, review, and publish consistent guidance.'"></p><a th:unless="${isCustomer}" href="/knowledge/new" class="btn btn-primary">+ New article</a></div><label class="library-search"><span>⌕</span><input type="search" placeholder="Search setup, billing, permissions…" data-filter=".article-card" aria-label="Search knowledge base"></label><section class="article-grid"><a class="article-card" th:each="k:${articles}" th:href="@{/knowledge/{id}(id=${k.id})}" th:data-search="${k.title+' '+k.summary}"><div><span class="eyebrow" th:text="${k.visibility}"></span><span th:unless="${isCustomer}" class="badge status" th:text="${#strings.replace(k.status,'_',' ')}"></span></div><h2 th:text="${k.title}"></h2><p th:text="${k.summary}"></p><span>Read article →</span></a><div class="empty" th:if="${#lists.isEmpty(articles)}"><strong>No published answers yet.</strong><span>Open a ticket and the support team will help.</span></div></section></div></main></body></html>
