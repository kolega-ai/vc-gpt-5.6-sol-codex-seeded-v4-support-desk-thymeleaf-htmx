<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('People & teams')}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><main class="app-main"><header th:replace="~{fragments :: topbar('People & teams','ADMINISTRATION')}"></header><div class="content"><div th:replace="~{fragments :: flash}"></div><section class="metric-grid compact"><article><span>People</span><strong th:text="${#lists.size(adminData.users)}"></strong><small>Across support and customers</small></article><article><span>Support teams</span><strong th:text="${#lists.size(adminData.teams)}"></strong><small>Active routing scopes</small></article><article><span>Customers</span><strong th:text="${#lists.size(adminData.organizations)}"></strong><small>Organisation boundaries</small></article></section><section class="panel"><div class="panel-head"><div><p class="eyebrow">ACCESS CONTROL</p><h2>User accounts</h2><p>Changes take effect on the next authorized request. Support never impersonates users.</p></div></div><div class="table-wrap"><table><thead><tr><th>User</th><th>Scope</th><th>Role</th><th>Account</th><th>Action</th></tr></thead><tbody><tr th:each="u:${adminData.users}"><td><strong th:text="${u.displayName}"></strong><span th:text="${u.username}"></span></td><td th:text="${u.organizationId != null?'Organisation '+u.organizationId:(u.teamId != null?'Team '+u.teamId:'All teams')}"></td><td><span class="badge status" th:text="${#strings.replace(u.role,'_',' ')}"></span></td><td><span th:class="${u.enabled}?'state on':'state off'" th:text="${u.enabled}?'Enabled':'Disabled'"></span></td><td><a class="btn btn-quiet" th:href="@{/desk/cover/{c}(c=${u.username})}">Cover</a><form class="inline-form" method="post" th:action="@{/admin/users/{id}(id=${u.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="role" aria-label="Role"><option th:each="r:${ {'CUSTOMER_USER','SUPPORT_AGENT','TEAM_LEAD','SUPPORT_ADMIN'} }" th:value="${r}" th:text="${#strings.replace(r,'_',' ')}" th:selected="${r==u.role}"></option></select><label class="check"><input type="checkbox" name="enabled" value="true" th:checked="${u.enabled}">Enabled</label><button class="btn btn-quiet">Save</button></form></td></tr></tbody></table></div></section></div></main></body></html>
