<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Escalations')}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><main class="app-main"><header th:replace="~{fragments :: topbar('Escalation review','LEAD WORKSPACE')}"></header><div class="content"><div th:replace="~{fragments :: flash}"></div><div class="page-actions"><p>Review customer impact, establish ownership, and record the resolution.</p></div><section class="card-grid"><article class="escalation-card" th:each="e:${escalations}"><div class="card-top"><a th:href="@{/tickets/{id}(id=${e.ticketId})}" class="mono" th:text="${e.ticketReference}"></a><span class="badge high" th:text="${#strings.replace(e.status,'_',' ')}"></span></div><p th:text="${e.reason}"></p><dl><div><dt>Owner</dt><dd th:text="${e.owner}"></dd></div><div><dt>Last update</dt><dd th:text="${e.updatedAt}"></dd></div></dl><form method="post" th:action="@{/escalations/{id}(id=${e.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="deskTeamRef" th:value="${e.deskTeamRef}"><select name="status"><option value="accepted">Accept</option><option value="in_review">Start review</option><option value="resolved">Resolve</option><option value="rejected">Reject</option></select><textarea name="resolution" rows="2" maxlength="2000" placeholder="Decision or next action"></textarea><button class="btn btn-primary full">Update review</button></form><form method="post" th:action="@{/escalations/{id}/transfer(id=${e.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="deskTeamRef" type="number" placeholder="Target team id" required><button class="btn btn-quiet full">Move to team</button></form></article></section></div></main></body></html>
