<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Overview')}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><main class="app-main"><header th:replace="~{fragments :: topbar(${isCustomer}?'Your support home':'Service overview',${isCustomer}?'Customer portal':'Live operations')}"></header><div class="content"><div th:replace="~{fragments :: flash}"></div>
<section class="welcome-strip"><div><span class="eyebrow" th:text="${isCustomer}?'YOUR ORGANISATION':'TODAY’S SERVICE PULSE'">Pulse</span><h2 th:text="${isCustomer}?'We’re here when you need us.':'Keep the queue moving with care.'">Welcome</h2><p th:text="${isCustomer}?'Track open requests, add context, or find a quick answer in the knowledge base.':'Start with the tickets nearest their promise time; handoffs and escalations are visible to the whole team.'"></p></div><a th:if="${isCustomer}" href="/tickets/new" class="btn btn-coral">Open a ticket</a><a th:unless="${isCustomer}" href="/tickets?status=open" class="btn btn-coral">Work the queue</a></section>
<section class="metric-grid"><article><span>Tickets in scope</span><strong th:text="${dashboard.tickets}">0</strong><small>Your visible workload</small></article><article class="warning"><span>Past SLA</span><strong th:text="${dashboard.overdue}">0</strong><small>Needs a clear next step</small></article><article><span>Escalations</span><strong th:text="${dashboard.escalations}">0</strong><small>Lead review activity</small></article><article><span>Unread updates</span><strong th:text="${dashboard.unread}">0</strong><small>Since your last visit</small></article></section>
<section class="panel"><div class="panel-head"><div><p class="eyebrow">RECENT WORK</p><h2>Tickets moving now</h2></div><a href="/tickets">View full queue →</a></div><div class="table-wrap"><table><thead><tr><th>Ticket</th><th>Customer</th><th>Owner</th><th>Priority</th><th>Status</th><th>SLA</th></tr></thead><tbody><tr th:each="t:${dashboard.recent}"><td><a th:href="@{/tickets/{id}(id=${t.id})}"><strong th:text="${t.reference}"></strong><span th:text="${t.subject}"></span></a></td><td th:text="${t.organization}"></td><td th:text="${t.assignee}"></td><td><span class="badge" th:classappend="${t.priority}" th:text="${t.priority}"></span></td><td><span class="badge status" th:text="${#strings.replace(t.status,'_',' ')}"></span></td><td><span th:class="${t.overdue}?'sla overdue':'sla'" th:text="${t.overdue}?'Past due':'On track'"></span></td></tr></tbody></table></div></section>
</div></main></body></html>
