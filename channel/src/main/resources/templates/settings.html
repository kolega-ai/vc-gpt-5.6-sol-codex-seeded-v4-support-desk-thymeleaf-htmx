<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Desk settings')}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><main class="app-main"><header th:replace="~{fragments :: topbar('Desk settings','ADMINISTRATION')}"></header><div class="content"><div th:replace="~{fragments :: flash}"></div><section class="settings-grid">
<article class="panel"><div class="panel-head"><div><p class="eyebrow">ROUTING</p><h2>Teams &amp; queues</h2></div></div><ul class="plain-list"><li th:each="x:${settings.teams}"><strong th:text="${x.name}"></strong><span th:text="${x.queue_key + ' · ' + x.description}"></span></li></ul><form class="setting-form" method="post" action="/admin/settings/teams"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="name" maxlength="100" required placeholder="Team name"><input name="queueKey" pattern="[a-z0-9-]+" required placeholder="queue-key"><input name="description" maxlength="300" required placeholder="Routing purpose"><button class="btn btn-primary">Add team</button></form></article>
<article class="panel"><div class="panel-head"><div><p class="eyebrow">CLASSIFICATION</p><h2>Categories</h2></div></div><ul class="plain-list"><li th:each="x:${settings.categories}"><strong th:text="${x.name}"></strong><span th:text="${x.description}"></span></li></ul><form class="setting-form" method="post" action="/admin/settings/categories"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="name" maxlength="100" required placeholder="Category name"><input name="description" maxlength="300" required placeholder="When to use it"><button class="btn btn-primary">Add category</button></form></article>
<article class="panel"><div class="panel-head"><div><p class="eyebrow">SERVICE PROMISES</p><h2>SLA policies</h2></div></div><ul class="plain-list"><li th:each="x:${settings.slas}"><strong th:text="${x.name}"></strong><span th:text="${x.first_response_minutes + 'm response · ' + x.resolution_minutes + 'm resolution'}"></span></li></ul><form class="setting-form" method="post" action="/admin/settings/slas"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="name" maxlength="100" required placeholder="Policy name"><select name="priority"><option th:each="p:${ {'urgent','high','normal','low'} }" th:value="${p}" th:text="${p}"></option></select><input name="response" type="number" min="5" required placeholder="Response minutes"><input name="resolution" type="number" min="5" required placeholder="Resolution minutes"><button class="btn btn-primary">Add SLA</button></form></article>
<article class="panel"><div class="panel-head"><div><p class="eyebrow">LOCAL INTEGRATIONS</p><h2>Webhooks</h2></div></div><ul class="plain-list"><li th:each="x:${settings.webhooks}"><strong th:text="${x.name}"></strong><span th:text="${x.event_type + ' · ' + x.target_url}"></span></li></ul><form class="setting-form" method="post" action="/admin/settings/webhooks"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="name" maxlength="100" required placeholder="Integration name"><input name="url" required value="http://core-mock:8082/mock/webhooks"><input name="event" required value="ticket.changed"><button class="btn btn-primary">Add webhook</button></form></article>
</section>
<section class="settings-grid">
<article class="panel"><div class="panel-head"><div><p class="eyebrow">REPORTING</p><h2>Customer report</h2></div></div><form class="setting-form" method="get" action="/reports/tickets"><input name="domain" placeholder="Domain filter"><button class="btn btn-primary">Run report</button></form></article>
<article class="panel"><div class="panel-head"><div><p class="eyebrow">MESSAGING</p><h2>Notice wording</h2></div></div><form class="setting-form" method="post" action="/notices/preview"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><textarea name="template" rows="3" placeholder="Case $reference is now $status"></textarea><button class="btn btn-primary">Preview notice</button></form></article>
<article class="panel"><div class="panel-head"><div><p class="eyebrow">AUTOMATION</p><h2>Routing formula</h2></div></div><form class="setting-form" method="get" action="/rules/preview"><input name="expr" placeholder="open &gt; 10 ? 'busy' : 'calm'" required><button class="btn btn-primary">Test formula</button></form></article>
<article class="panel"><div class="panel-head"><div><p class="eyebrow">MESSAGING</p><h2>Alert wording</h2></div></div><form class="setting-form" method="post" action="/alerts/render"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><textarea name="wording" rows="3" placeholder="Escalation ${reference} is ${status}"></textarea><button class="btn btn-primary">Render alert</button></form></article>
<article class="panel"><div class="panel-head"><div><p class="eyebrow">OPERATIONS</p><h2>Case envelope</h2></div></div><form class="setting-form" method="post" action="/cases/open"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><textarea name="envelope" rows="3" placeholder="Base64 case envelope" required></textarea><button class="btn btn-quiet">Open case</button></form></article>
</section>
<section class="panel"><div class="panel-head"><div><p class="eyebrow">RUNTIME</p><h2>Environment diagnostics</h2></div></div>
<div class="setting-form"><button class="btn btn-quiet" hx-get="/admin/settings/diagnostics/database" hx-target="#diagnostics">Database</button><button class="btn btn-quiet" hx-get="/admin/settings/diagnostics/integrations" hx-target="#diagnostics">Integrations</button><button class="btn btn-quiet" hx-get="/admin/settings/diagnostics/storage" hx-target="#diagnostics">Storage</button></div>
<div id="diagnostics" th:fragment="diagnostics-panel"><ul class="plain-list" th:if="${diagnostics}"><li th:each="e:${diagnostics}"><strong th:text="${e.key}"></strong><span th:text="${e.value}"></span></li></ul></div>
</section></div></main></body></html>
