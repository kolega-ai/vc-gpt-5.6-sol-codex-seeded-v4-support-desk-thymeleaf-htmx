<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head(${article.title})}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><main class="app-main"><div class="content article-page"><a class="back" href="/knowledge">← Back to knowledge</a><article><header><div><span class="eyebrow" th:text="${article.visibility}+' KNOWLEDGE'"></span><span th:unless="${isCustomer}" class="badge status" th:text="${#strings.replace(article.status,'_',' ')}"></span></div><h1 th:text="${article.title}"></h1><p th:text="${article.summary}"></p><small th:text="${'Updated ' + article.updatedAt + ' by ' + article.author}"></small></header><div class="article-body" th:text="${article.body}"></div><aside>Still stuck? <a th:if="${isCustomer}" href="/tickets/new">Open a support ticket →</a><a th:unless="${isCustomer}" href="/tickets">Check the support queue →</a></aside></article><section th:unless="${isCustomer}" class="panel workflow-bar"><div><strong>Article workflow</strong><span>Every transition is recorded in the audit trail.</span><a class="back" th:if="${article.status=='draft'}" th:href="@{/knowledge/{id}/edit(id=${article.id})}">Edit draft</a></div><form method="post" th:action="@{/knowledge/{id}/transition(id=${article.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="status"><option value="in_review">Send for review</option><option value="draft">Return to draft</option><option value="published">Publish</option><option value="archived">Archive</option></select><button class="btn btn-primary">Move article</button></form></section></div></main></body></html>
