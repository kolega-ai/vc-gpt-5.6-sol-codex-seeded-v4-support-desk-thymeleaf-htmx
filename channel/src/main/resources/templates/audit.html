<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Audit trail')}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><main class="app-main"><header th:replace="~{fragments :: topbar('Audit trail','APPEND-ONLY RECORD')}"></header><div class="content"><div class="page-actions"><p>Privileged actions, reads, exports, downloads, notes, and state transitions. Audit events cannot be edited or deleted.</p></div><section class="panel"><div class="table-wrap"><table class="audit-table"><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Resource</th><th>Change</th><th>Authorization basis</th></tr></thead><tbody><tr th:each="e:${events}"><td th:text="${e.at}"></td><td th:text="${e.actor}"></td><td><strong th:text="${#strings.replace(e.action,'_',' ')}"></strong></td><td th:text="${e.resourceType + ' · ' + e.resourceId}"></td><td><span th:text="${e.beforeValue?:'—'}"></span> → <span th:text="${e.afterValue?:'—'}"></span></td><td><code th:text="${e.authorizationBasis}"></code></td></tr></tbody></table></div></section></div></main></body></html>
