<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head(${detail.ticket.reference})}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><main class="app-main"><header class="detail-top"><div><a class="back" href="/tickets">← Back to tickets</a><div class="ticket-title"><span class="mono" th:text="${detail.ticket.reference}"></span><span class="badge status" th:text="${#strings.replace(detail.ticket.status,'_',' ')}"></span><h1 th:text="${detail.ticket.subject}"></h1></div></div><div th:unless="${isCustomer}" class="detail-actions"><form method="post" th:action="@{/tickets/{id}/transition(id=${detail.ticket.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="status" aria-label="New ticket status"><option value="open">Open</option><option value="pending_customer">Pending customer</option><option value="pending_internal">Pending internal</option><option value="resolved">Resolved</option><option value="closed">Closed</option></select><button class="btn btn-primary">Change status</button></form></div></header><div class="content"><div th:replace="~{fragments :: flash}"></div>
<div class="ticket-layout"><section class="ticket-main"><article class="panel ticket-brief"><div class="message-head"><div class="avatar" th:text="${#strings.substring(detail.ticket.requester,0,1)}"></div><div><strong th:text="${detail.ticket.requester}"></strong><span th:text="${detail.ticket.organization}"></span></div><time th:text="${detail.ticket.updatedAt}"></time></div><p th:utext="${detail.description}"></p></article>
<section class="conversation"><div class="section-title"><h2>Conversation</h2><span th:text="${#lists.size(detail.messages)}+' updates'"></span></div><article th:each="msg:${detail.messages}" th:class="${msg.kind=='INTERNAL_NOTE'}?'message note':'message'"><div class="message-head"><div class="avatar" th:text="${#strings.substring(msg.author,0,1)}"></div><div><strong th:text="${msg.author}"></strong><span th:if="${msg.kind=='INTERNAL_NOTE'}" class="badge internal">Internal note</span><span th:unless="${msg.kind=='INTERNAL_NOTE'}">Public reply</span></div><time th:text="${msg.createdAt}"></time></div><p th:text="${msg.body}"></p></article><div th:if="${#lists.isEmpty(detail.messages)}" class="empty">No replies yet. Add the first update below.</div></section>
<section class="panel reply-box"><div class="tabs"><button type="button" class="active" data-kind="PUBLIC_REPLY">Public reply</button><button th:unless="${isCustomer}" type="button" data-kind="INTERNAL_NOTE">Internal note</button></div><form method="post" th:action="@{/tickets/{id}/messages(id=${detail.ticket.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="kind" value="PUBLIC_REPLY" id="messageKind"><label class="sr-only" for="replyBody">Message</label><textarea id="replyBody" name="body" rows="5" maxlength="5000" required placeholder="Write a clear, helpful update…"></textarea><div class="form-actions"><span>Visible to <strong id="visibilityLabel">the customer</strong></span><button class="btn btn-primary">Send reply</button></div></form></section></section>
<aside class="ticket-side"><section th:class="${detail.ticket.overdue}?'sla-card overdue':'sla-card'"><div class="sla-rail"></div><p class="eyebrow">SERVICE PROMISE</p><strong th:text="${detail.ticket.overdue}?'Resolution overdue':'Resolution on track'"></strong><span th:text="${detail.ticket.resolutionDueAt}"></span><dl><div><dt>Priority</dt><dd><span class="badge" th:classappend="${detail.ticket.priority}" th:text="${detail.ticket.priority}"></span></dd></div><div><dt>Team</dt><dd th:text="${detail.ticket.team}"></dd></div><div><dt>Owner</dt><dd th:text="${detail.ticket.assignee}"></dd></div><div><dt>Category</dt><dd th:text="${detail.ticket.category}"></dd></div></dl></section>
<section th:unless="${isCustomer}" class="panel side-panel"><div class="section-title"><h3>Ownership</h3></div><form th:unless="${isLead}" method="post" th:action="@{/tickets/{id}/claim(id=${detail.ticket.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><button class="btn btn-quiet full">Claim this ticket</button></form><form th:if="${isLead}" method="post" th:action="@{/tickets/{id}/reassign(id=${detail.ticket.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="agentId" aria-label="Assign agent"><option th:each="agent:${assignable}" th:value="${agent.id}" th:text="${agent.displayName}"></option></select><select name="priority" aria-label="Priority"><option th:each="p:${ {'urgent','high','normal','low'} }" th:value="${p}" th:text="${p}" th:selected="${p==detail.ticket.priority}"></option></select><button class="btn btn-primary full">Reassign &amp; recalculate SLA</button></form></section>
<section class="panel side-panel"><div class="section-title"><h3>Attachments</h3><span th:text="${#lists.size(detail.attachments)}"></span></div><a class="attachment" th:each="f:${detail.attachments}" th:href="@{/attachments/{id}(id=${f.id})}"><span>▧</span><span><strong th:text="${f.name}"></strong><small th:text="${f.category + ' · ' + f.sizeBytes + ' bytes'}"></small></span></a><form class="upload" method="post" enctype="multipart/form-data" th:action="@{/tickets/{id}/attachments(id=${detail.ticket.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><select name="category" aria-label="Attachment category"><option value="CUSTOMER_EVIDENCE">Customer evidence</option><option value="SUPPORT_DOCUMENT">Support document</option></select><input type="file" name="file" required accept=".pdf,.png,.jpg,.jpeg,.txt"><button class="btn btn-quiet full">Upload file</button></form></section>
<section th:unless="${isCustomer}" class="panel side-panel"><div class="section-title"><h3>Escalation</h3></div><div th:if="${detail.escalation}"><span class="badge high" th:text="${detail.escalation.status}"></span><p th:text="${detail.escalation.reason}"></p></div><form th:unless="${detail.escalation}" method="post" th:action="@{/tickets/{id}/escalate(id=${detail.ticket.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><textarea name="reason" maxlength="1000" required rows="3" placeholder="Why does this need lead review?"></textarea><button class="btn btn-danger full">Request escalation</button></form></section>
<section th:unless="${isCustomer}" class="panel side-panel"><div class="section-title"><h3>Case transcript</h3></div><form method="post" th:action="@{/tickets/{id}/transcript(id=${detail.ticket.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="transcriptName" placeholder="transcript-file.txt" required><button class="btn btn-quiet full">File transcript</button></form><form method="post" th:action="@{/tickets/{id}/contact-passcode(id=${detail.ticket.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="contact" placeholder="customer@example.com" required><button class="btn btn-quiet full">Send access passcode</button></form><form method="post" th:action="@{/tickets/{id}/contact-confirm(id=${detail.ticket.id})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input name="contact" placeholder="customer@example.com" required><input name="code" placeholder="6-digit code" required><button class="btn btn-quiet full">Confirm contact</button></form><a class="btn btn-quiet full" th:href="@{/tickets/{id}/transcript(id=${detail.ticket.id})}">View transcript</a></section><section th:if="${isLead}" class="panel side-panel"><div class="section-title"><h3>Staff directory</h3></div><form method="get" action="/directory/agents"><input name="uid" placeholder="Directory uid" required><button class="btn btn-quiet full">Resolve agent</button></form></section>
<section th:unless="${isCustomer}" class="panel side-panel"><div class="section-title"><h3>Audit history</h3></div><div class="mini-event" th:each="event:${detail.audit}"><i></i><div><strong th:text="${#strings.replace(event.action,'_',' ')}"></strong><span th:text="${event.actor}"></span></div></div></section></aside></div></div></main></body></html>
