<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Profile')}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><main class="app-main"><header th:replace="~{fragments :: topbar('Your profile','ACCOUNT')}"></header><div class="content narrow"><div th:replace="~{fragments :: flash}"></div><section class="panel form-panel"><div class="profile-hero"><span class="avatar large" th:text="${#strings.substring(profile.displayName,0,1)}"></span><div><h2 th:text="${profile.displayName}"></h2><p th:text="${#strings.replace(profile.roleHint,'_',' ')}"></p></div></div><form method="post" action="/profile"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Display name<input name="displayName" th:value="${profile.displayName}" minlength="2" maxlength="120" required></label><label>Email address<input th:value="${profile.email}" disabled><small>Contact an administrator to change the login email.</small></label><div class="form-actions"><a class="btn btn-quiet" href="/dashboard">Cancel</a><button class="btn btn-primary">Save changes</button></div></form></section><section th:if="${coverProfile}" class="panel form-panel"><div class="section-title"><h3>Cover update</h3></div><form method="post" th:action="@{/profile/{u}(u=${coverProfile.username})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Display name<input name="displayName" th:value="${coverProfile.displayName}" minlength="2" maxlength="120" required></label><input type="hidden" name="pictureUrl" th:value="${coverProfile.pictureUrl}"><button class="btn btn-primary">Save cover update</button></form></section><section class="panel form-panel"><div class="section-title"><h3>Partner passphrase</h3></div><p>Used by the partner desk app to confirm your identity before it releases shared cases.</p><form method="post" th:action="@{/partners/{handle}/credential(handle=${profile.username})}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><label>Passphrase<input name="passphrase" autocomplete="off" minlength="8" required></label><button class="btn btn-primary">Set partner passphrase</button></form></section></div></main></body></html>
