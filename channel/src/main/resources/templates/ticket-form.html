<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Open a ticket')}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><main class="app-main"><header th:replace="~{fragments :: topbar('Open a support ticket','CUSTOMER PORTAL')}"></header><div class="content narrow"><a class="back" href="/tickets">← Back to organisation tickets</a><section class="panel form-panel"><div class="panel-head"><div><p class="eyebrow">TELL US WHAT HAPPENED</p><h2>What can we help with?</h2><p>Include the outcome you expected and any error message you saw. You can attach evidence after creating the ticket.</p></div></div><form method="post" action="/tickets" th:object="${ticketForm}"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="backTo" th:value="${backTo}"><label>Subject<input th:field="*{subject}" maxlength="180" required placeholder="A short summary of the issue"><small th:errors="*{subject}" class="field-error"></small></label><div class="form-grid"><label>Category<select th:field="*{categoryId}" required><option value="">Choose a category</option><option th:each="c:${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></label><label>Impact<select th:field="*{priority}"><option value="low">Low — question or guidance</option><option value="normal">Normal — work can continue</option><option value="high">High — significant disruption</option><option value="urgent">Urgent — service unavailable</option></select></label></div><label>Details<textarea th:field="*{description}" rows="9" maxlength="5000" required placeholder="Describe what happened, when it started, and any steps already tried."></textarea><small>Do not include passwords, API secrets, or payment card details.</small><small th:errors="*{description}" class="field-error"></small></label><div class="form-actions"><a class="btn btn-quiet" href="/tickets">Cancel</a><button class="btn btn-primary">Create ticket</button></div></form></section></div></main></body></html>
