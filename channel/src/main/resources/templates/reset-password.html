<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose password</title><link rel="stylesheet" href="/css/app.css"></head><body class="auth-page simple"><main class="auth-card solo"><a class="brand" href="/login"><span class="brand-mark">N</span><span>Northstar<small>Support desk</small></span></a><div><p class="eyebrow">SECURE RESET</p><h2>Choose a new password</h2><p class="muted">Use at least 12 characters. This link works once and expires after 30 minutes.</p></div><form method="post" action="/reset-password"><input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"><input type="hidden" name="token" th:value="${token}"><label>New password<input type="password" name="password" minlength="12" maxlength="128" required autofocus autocomplete="new-password"></label><button class="btn btn-primary full">Change password</button></form></main></body></html>
