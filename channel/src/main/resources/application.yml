server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: false
        same-site: lax
        secure: ${COOKIE_SECURE:false}
      timeout: 30m
  error:
    include-message: always
    include-stacktrace: always
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supportdesk}
    username: ${DB_USER:support}
    password: ${DB_PASSWORD:local-support-password}
  jpa:
    hibernate: { ddl-auto: validate }
    properties: { hibernate.default_schema: channel }
    open-in-view: false
  flyway:
    schemas: channel
    create-schemas: true
  thymeleaf: { cache: false }
  servlet.multipart: { max-file-size: 10MB, max-request-size: 12MB }
app:
  decision-url: ${DECISION_URL:http://localhost:8081}
  token-secret: ${TOKEN_SECRET:local-development-signing-key-change-me-32}
