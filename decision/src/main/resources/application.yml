server: { port: 8081 }
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/supportdesk}
    username: ${DB_USER:support}
    password: ${DB_PASSWORD:local-support-password}
  jpa:
    hibernate: { ddl-auto: validate }
    properties: { hibernate.default_schema: decision }
    open-in-view: false
  flyway: { schemas: decision, create-schemas: true }
  servlet.multipart: { max-file-size: 10MB, max-request-size: 12MB }
app:
  token-secret: ${TOKEN_SECRET:local-development-signing-key-change-me-32}
  scope-secret: ${SCOPE_SECRET:local-development-core-key-change-me-32}
  file-root: ${FILE_ROOT:./uploads}
  core-url: ${CORE_URL:http://localhost:8082}
server.error.include-message: never
management:
  endpoints:
    web:
      exposure:
        include: env,heapdump,beans,configprops
  server:
    address: 0.0.0.0
